<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Дасгал ажил 1</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    table {
      border-collapse: collapse;
      font-weight: bold;
      text-transform: uppercase;
    }
    th, td {
      border: 4px solid #00f59b;
      padding: 10px 20px;
      text-align: center;
    }
    td ul {
      display: inline-block;
      text-align: left;
    }
  </style>
</head>
<body>
  <!-- Хэрэглэгчдийн хүснэгт -->
  <table>
    <tr>
      <th>№</th>
      <th>Цээж зураг</th>
      <th>Хэрэглэгчийн нэр</th>
      <th>Хийх дуртай зүйлс</th>
    </tr>
    <tr>
      <td>1</td>
      <td><img src="avatar.png" alt="Хэрэглэгч 1-ийн цээж зураг" width="160" height="196"></td>
      <td>Овог Нэр</td>
      <td>
        <ul>
          <li>Дуртай зүйл 1</li>
          <li>Дуртай зүйл 2</li>
          <li>Дуртай зүйл 3</li>
        </ul>
      </td>
    </tr>
    <tr>
      <td>2</td>
      <td><img src="avatar.png" alt="Хэрэглэгч 2-ын цээж зураг" width="160" height="196"></td>
      <td>Овог Нэр</td>
      <td>
        <ul>
          <li>Дуртай зүйл 1</li>
          <li>Дуртай зүйл 2</li>
          <li>Дуртай зүйл 3</li>
        </ul>
      </td>
    </tr>
  </table>
</body>
</html>
