<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <!-- Утсан дээр хуудсыг жижигрүүлэлгүй, дэлгэцийн жинхэнэ өргөнөөр харуулна -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Миний хуудас</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .header {
      background: #74c0fc;
      padding: 15px;
    }
    .header form {
      display: flex;
      justify-content: center;
      gap: 40px;
    }
    .header button {
      background: #d9d9d9;
      border: 1px solid #999;
      font-size: 18px;
      padding: 6px 30px;
      cursor: pointer;
    }
    /* Үндсэн хэсэг: grid-template-areas ашиглан хэсэг бүрийн байрлалыг тодорхойлно */
    .main {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }
    .sidebar {
      grid-area: side;
      background: #e9e9e9;
      padding: 20px;
      text-align: center;
    }
    .sidebar img {
      background: #616161;
    }
    .sidebar p {
      border-bottom: 1px solid #000;
      margin: 12px 0;
      padding-bottom: 6px;
    }
    .content {
      grid-area: content;
      background: #e9e9e9;
      min-height: 450px;
    }
    .content iframe {
      width: 100%;
      height: 100%;
      min-height: 450px;
      border: none;
      display: block;
    }
    .address {
      grid-area: address;
      background: #f19d92;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }

    /* ===== 1. Desktop (1025px-ээс өргөн) =====
       Зүүн талд нарийн профайл, баруун талд агуулга, түүний доор хаяг */
    @media (min-width: 1025px) {
      .main {
        grid-template-columns: 300px 1fr;
        grid-template-areas:
          "side content"
          "side address";
      }
    }

    /* ===== 2. Laptop & tablet (601px - 1024px) =====
       Профайл болон агуулга тэнцүү 2 багана, хаяг доор бүтэн өргөнөөр */
    @media (min-width: 601px) and (max-width: 1024px) {
      .main {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "side content"
          "address address";
      }
      .header form {
        gap: 20px;
      }
      .header button {
        font-size: 16px;
        padding: 6px 16px;
      }
    }

    /* ===== 3. Mobile (600px ба түүнээс бага) =====
       Товчнууд 2x2, бүх хэсэг дээрээс доош нэг баганаар */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .header form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 20px;
      }
      .header button {
        font-size: 14px;
        padding: 6px 0;
      }
      .main {
        grid-template-columns: 1fr;
        grid-template-areas:
          "side"
          "content"
          "address";
        gap: 10px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Толгой хэсэг: товч дарахад зөвхөн "content" нэртэй iframe өөрчлөгдөнө -->
  <div class="header">
    <form>
      <button type="submit" formaction="nuur.html" formtarget="content">Нүүр хуудас</button>
      <button type="submit" formaction="zurguud.html" formtarget="content">Зурагнууд</button>
      <button type="submit" formaction="bichlegs.html" formtarget="content">Бичлэгнүүд</button>
      <button type="submit" formaction="gazriin-zurag.html" formtarget="content">Газрын зураг</button>
    </form>
  </div>

  <div class="main">
    <!-- Профайл зураг ба хувийн мэдээлэл -->
    <div class="sidebar">
      <img src="avatar.png" alt="Профайл зураг" width="200" height="247">
      <p><b>Хувийн мэдээлэл</b></p>
      <!-- ӨӨРЧЛӨХ: өөрийн мэдээллээр солино -->
      <p>Овог нэр: Овог Нэр</p>
      <p>Төрсөн он: 2005</p>
      <p>Сургууль: СЭЗИС</p>
      <p>Мэргэжил: Мэргэжлийн нэр</p>
      <p>Сонирхол: Дуртай зүйл</p>
    </div>

    <!-- Агуулга хэсэг -->
    <div class="content">
      <iframe name="content" src="nuur.html" title="Агуулга"></iframe>
    </div>

    <!-- ӨӨРЧЛӨХ: өөрийн гэрийн хаягаар солино -->
    <div class="address">Гэрийн хаяг: Улаанбаатар хот, ... дүүрэг, ... хороо</div>
  </div>
</body>
</html>
