<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Миний хуудас</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .header {
      background: #74c0fc;
      padding: 15px;
      text-align: center;
    }
    .header button {
      background: #d9d9d9;
      border: 1px solid #999;
      font-size: 18px;
      padding: 6px 30px;
      margin: 0 20px;
      cursor: pointer;
    }
    .main {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .sidebar {
      width: 300px;
      background: #e9e9e9;
      padding: 20px;
      text-align: center;
    }
    .sidebar img {
      background: #616161;
    }
    .sidebar p {
      border-bottom: 1px solid #000;
      margin: 12px 0;
      padding-bottom: 6px;
    }
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .content {
      flex: 1;
      background: #e9e9e9;
    }
    .content iframe {
      width: 100%;
      height: 100%;
      min-height: 450px;
      border: none;
    }
    .address {
      background: #f19d92;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Толгой хэсэг: товч дарахад зөвхөн "content" нэртэй iframe өөрчлөгдөнө -->
  <div class="header">
    <form>
      <button type="submit" formaction="nuur.html" formtarget="content">Нүүр хуудас</button>
      <button type="submit" formaction="zurguud.html" formtarget="content">Зурагнууд</button>
      <button type="submit" formaction="bichlegs.html" formtarget="content">Бичлэгнүүд</button>
      <button type="submit" formaction="gazriin-zurag.html" formtarget="content">Газрын зураг</button>
    </form>
  </div>

  <div class="main">
    <!-- Зүүн тал: профайл зураг ба хувийн мэдээлэл -->
    <div class="sidebar">
      <img src="avatar.png" alt="Профайл зураг" width="200" height="247">
      <p><b>Хувийн мэдээлэл</b></p>
      <!-- ӨӨРЧЛӨХ: өөрийн мэдээллээр солино -->
      <p>Овог нэр: Овог Нэр</p>
      <p>Төрсөн он: 2005</p>
      <p>Сургууль: СЭЗИС</p>
      <p>Мэргэжил: Мэргэжлийн нэр</p>
      <p>Сонирхол: Дуртай зүйл</p>
    </div>

    <div class="right">
      <!-- Агуулга хэсэг -->
      <div class="content">
        <iframe name="content" src="nuur.html" title="Агуулга"></iframe>
      </div>
      <!-- ӨӨРЧЛӨХ: өөрийн гэрийн хаягаар солино -->
      <div class="address">Гэрийн хаяг: Улаанбаатар хот, ... дүүрэг, ... хороо</div>
    </div>
  </div>
</body>
</html>
