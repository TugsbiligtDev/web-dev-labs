<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fetch() - Хэрэглэгчид</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 720px">
    <h1 class="h3">fetch()</h1>
    <p class="text-muted">
      Үнэгүй API: <a href="https://jsonplaceholder.typicode.com/users">jsonplaceholder.typicode.com/users</a>
    </p>

    <button class="btn btn-primary mb-3" id="loadBtn">Дахин татах</button>

    <!-- Ачаалж байх үед харагдах spinner -->
    <div class="text-center my-4 d-none" id="loading">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Ачаалж байна...</span></div>
    </div>

    <!-- Алдаа гарвал харагдах Bootstrap alert -->
    <div class="alert alert-danger d-none" id="error" role="alert"></div>

    <!-- Bootstrap list-group: өгөгдөл энд жагсаалт болж гарна -->
    <ul class="list-group" id="userList"></ul>
  </div>

  <script>
    const API_URL = 'https://jsonplaceholder.typicode.com/users';
    const list = document.getElementById('userList');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const loadBtn = document.getElementById('loadBtn');

    // Нэг хэрэглэгчийн мэдээллээр list-group-item үүсгэнэ
    function createItem(user) {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-start gap-3';

      const info = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'fw-semibold';
      name.innerText = user.name;
      const email = document.createElement('div');
      email.className = 'small text-muted';
      email.innerText = user.email + ' · ' + user.address.city;
      info.appendChild(name);
      info.appendChild(email);

      // Bootstrap badge: компанийн нэр
      const badge = document.createElement('span');
      badge.className = 'badge text-bg-primary rounded-pill';
      badge.innerText = user.company.name;

      li.appendChild(info);
      li.appendChild(badge);
      return li;
    }

    async function loadUsers() {
      list.innerHTML = '';
      errorBox.classList.add('d-none');
      loading.classList.remove('d-none');
      loadBtn.disabled = true;

      try {
        // fetch(): API руу хүсэлт илгээж, хариуг хүлээнэ
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error('Сервер алдаа буцаалаа (' + response.status + ')');
        }
        // Хариуг JSON (JavaScript массив) болгон хувиргана
        const users = await response.json();
        users.forEach(function (user) {
          list.appendChild(createItem(user));
        });
      } catch (err) {
        errorBox.innerText = 'Өгөгдөл татаж чадсангүй: ' + err.message + '. Интернэт холболтоо шалгана уу.';
        errorBox.classList.remove('d-none');
      } finally {
        loading.classList.add('d-none');
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', loadUsers);
    loadUsers();
  </script>
</body>
</html>
