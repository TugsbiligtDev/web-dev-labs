<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image</title>
  <style>
    #preview {
      display: block;
      max-width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>FileReader()</h1>

  <!-- accept="image/*": файл сонгох цонхонд зөвхөн зураг харуулна -->
  <input type="file" id="fileInput" accept="image/*">
  <p id="message" hidden></p>
  <img id="preview" alt="" hidden>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const message = document.getElementById('message');

    // Файл сонгоход ажиллана
    fileInput.addEventListener('change', function () {
      const file = fileInput.files[0];
      message.hidden = true;
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        message.innerText = 'Зөвхөн зураг сонгоно уу.';
        message.hidden = false;
        preview.hidden = true;
        fileInput.value = '';
        return;
      }

      // FileReader: компьютер дээрх файлыг browser дотор уншина
      const reader = new FileReader();

      // Уншиж дуусахад reader.result-д "data:image/...;base64,..." хэлбэрийн текст ирнэ
      reader.onload = function () {
        preview.src = reader.result;
        preview.alt = file.name;
        preview.hidden = false;
      };

      // Зургийг data URL болгон унших
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
