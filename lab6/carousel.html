<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дасгал 3 - Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
  <div class="container py-4">
    <!-- Mobile: зургууд дээрээс доош жагсана.
         d-md-none = 768px ба түүнээс өргөн дэлгэц дээр нуугдана -->
    <div class="d-md-none">
      <img src="image1.svg" class="img-fluid d-block mb-2" alt="Зураг 1">
      <img src="image2.svg" class="img-fluid d-block mb-2" alt="Зураг 2">
      <img src="image3.svg" class="img-fluid d-block" alt="Зураг 3">
    </div>

    <!-- Desktop: carousel (гүйдэг зураг).
         d-none d-md-block = mobile дээр нуугдаж, 768px-ээс өргөн дэлгэц дээр харагдана -->
    <div id="photoCarousel" class="carousel slide d-none d-md-block" data-bs-ride="carousel" data-bs-theme="dark">
      <!-- Доод талын зураасан заагч -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#photoCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Зураг 1"></button>
        <button type="button" data-bs-target="#photoCarousel" data-bs-slide-to="1" aria-label="Зураг 2"></button>
        <button type="button" data-bs-target="#photoCarousel" data-bs-slide-to="2" aria-label="Зураг 3"></button>
      </div>

      <!-- Слайдууд -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="image1.svg" class="d-block w-100" alt="Зураг 1">
          <div class="carousel-caption">
            <h5>Эхний слайд</h5>
            <p>Эхний слайдын тайлбар текст.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="image2.svg" class="d-block w-100" alt="Зураг 2">
          <div class="carousel-caption">
            <h5>Хоёр дахь слайд</h5>
            <p>Хоёр дахь слайдын тайлбар текст.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="image3.svg" class="d-block w-100" alt="Зураг 3">
          <div class="carousel-caption">
            <h5>Гурав дахь слайд</h5>
            <p>Гурав дахь слайдын тайлбар текст.</p>
          </div>
        </div>
      </div>

      <!-- Өмнөх / дараагийн сумнууд -->
      <button class="carousel-control-prev" type="button" data-bs-target="#photoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Өмнөх</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#photoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Дараах</span>
      </button>
    </div>
  </div>

  <!-- Carousel ажиллахад Bootstrap-ийн JavaScript шаардлагатай -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
